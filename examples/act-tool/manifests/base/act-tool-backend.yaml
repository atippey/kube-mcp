apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-tool
  namespace: mcp-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: act-tool
  template:
    metadata:
      labels:
        app: act-tool
        mcp-server: act-tool
    spec:
      volumes:
        - name: dind-storage
          emptyDir: {}
        - name: docker-socket
          emptyDir: {}
        - name: workspace
          emptyDir: {}
      initContainers:
        - name: clone-repo
          image: alpine/git
          # For example purposes, we clone this repo itself to test .github/workflows
          command: ["git", "clone", "https://github.com/atippey/kube-mcp.git", "."]
          workingDir: /workspace
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: act-tool
          image: act-tool
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          ports:
            - containerPort: 8080
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: workspace
              mountPath: /workspace
        # DinD sidecar
        # Note: ARC (Actions Runner Controller) is an alternative approach that avoids DinD entirely.
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
            - name: docker-socket
              mountPath: /var/run
            # Important: Mount the workspace so the Docker daemon (in sidecar) can see the files
            # when act (in main container) requests a bind mount of /workspace.
            - name: workspace
              mountPath: /workspace
---
apiVersion: v1
kind: Service
metadata:
  name: act-tool-svc
  namespace: mcp-test
spec:
  selector:
    app: act-tool
  ports:
    - port: 8080
      targetPort: 8080
