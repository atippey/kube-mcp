apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance-tool
  namespace: mcp-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-tool
  namespace: mcp-test
  labels:
    app.kubernetes.io/name: compliance-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: compliance-tool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compliance-tool
    spec:
      serviceAccountName: compliance-tool
      containers:
        - name: compliance-tool
          image: ghcr.io/atippey/compliance-tool:latest
          ports:
            - containerPort: 8080
          env:
            - name: COMPLIANCE_ALLOW_REMOTE
              value: "false"
            - name: IRON_BANK_READ_API
              valueFrom:
                secretKeyRef:
                  name: compliance-tool-secrets
                  key: iron_bank_read_api
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-tool-svc
  namespace: mcp-test
  labels:
    app.kubernetes.io/name: compliance-tool
spec:
  selector:
    app.kubernetes.io/name: compliance-tool
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Secret
metadata:
  name: compliance-tool-secrets
  namespace: mcp-test
type: Opaque
stringData:
  iron_bank_read_api: ""
