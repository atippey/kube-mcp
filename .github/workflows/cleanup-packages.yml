name: Cleanup Branch Packages

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly, Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete branch-tagged versions older than N days'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  cleanup:
    name: Prune branch-prefixed package versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [mcp-operator, mcp-echo-server]
    steps:
      - name: Delete old branch-tagged versions (${{ matrix.package }})
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          token: ${{ secrets.DOCKER_PAT }}
          min-versions-to-keep: 1
          ignore-versions-younger-than-days: ${{ inputs.days || 7 }}
          package-version-pattern: '^branch-'
