apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-operator-policy
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-operator
    app.kubernetes.io/component: operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-operator
      app.kubernetes.io/component: operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Health probes + metrics scraping from anywhere in the cluster
    - ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-redis
              app.kubernetes.io/component: cache
      ports:
        - port: 6379
          protocol: TCP
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-redis-policy
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-redis
    app.kubernetes.io/component: cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-redis
      app.kubernetes.io/component: cache
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Default: operator and MCP server pods in mcp-system can reach Redis.
    # Optional: MCP server pods from labeled namespaces can also connect.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-operator
              app.kubernetes.io/component: operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
        - namespaceSelector:
            matchLabels:
              mcp.k8s.turd.ninja/allow-redis-access: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
      ports:
        - port: 6379
          protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-policy
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Dev/k3d: permissive — any pod in the cluster can reach MCP server.
    # Production overlay restricts this to ingress-controller + labeled namespaces.
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-redis
              app.kubernetes.io/component: cache
      ports:
        - port: 6379
          protocol: TCP
    # Tool backing services — any namespace, any port
    - to:
        - namespaceSelector: {}
    # DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
