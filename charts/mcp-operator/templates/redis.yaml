{{- if .Values.redis.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "mcp-operator.chart" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-redis
      app.kubernetes.io/component: cache
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/instance: {{ .Release.Name }}
        helm.sh/chart: {{ include "mcp-operator.chart" . }}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "mcp-operator.chart" . }}
spec:
  selector:
    app.kubernetes.io/name: mcp-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
{{- end }}
