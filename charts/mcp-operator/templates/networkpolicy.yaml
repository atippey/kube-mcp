{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-operator-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Health probes + metrics scraping from anywhere in the cluster
    - ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    # Redis (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-redis
              app.kubernetes.io/component: cache
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 6379
          protocol: TCP
    # Kubernetes API server — broad by default, pin in production overlay
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-redis-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "mcp-operator.chart" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-redis
      app.kubernetes.io/component: cache
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Operator and MCP server pods in mcp-system
    - from:
        - podSelector:
            matchLabels:
              {{- include "mcp-operator.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
        # Cross-namespace: MCP server pods from labeled namespaces
        - namespaceSelector:
            matchLabels:
              mcp.k8s.turd.ninja/allow-cross-namespace: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
      ports:
        - port: 6379
          protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-server
    helm.sh/chart: {{ include "mcp-operator.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Restrictive by default: only labeled namespaces can reach MCP server.
    # Dev/k3d overlays patch this to be permissive.
    - from:
        - namespaceSelector:
            matchLabels:
              mcp.k8s.turd.ninja/allow-cross-namespace: "true"
      ports:
        - port: 8080
          protocol: TCP
  # Safe-by-default: deny all egress until MCPServer controller writes
  # per-server egress allow rules.
  egress: []
{{- end }}
